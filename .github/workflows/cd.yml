name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  functional-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=bike_sharing" >> .env

      - name: Pull Docker image
        run: docker pull ani31415/bike-sharing-api:latest

      - name: Start containers
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for services to start
        run: sleep 20

      - name: Create predictions table
        run: |
          docker exec bike-sharing-db mysql -u root -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" bike_sharing -e "
          CREATE TABLE IF NOT EXISTS predictions (
              id INT AUTO_INCREMENT PRIMARY KEY,
              season INT NOT NULL CHECK (season BETWEEN 1 AND 4),
              holiday INT NOT NULL CHECK (holiday IN (0, 1)),
              workingday INT NOT NULL CHECK (workingday IN (0, 1)),
              weather INT NOT NULL CHECK (weather BETWEEN 1 AND 4),
              temp FLOAT NOT NULL,
              humidity FLOAT NOT NULL,
              windspeed FLOAT NOT NULL,
              hour INT NOT NULL CHECK (hour BETWEEN 0 AND 23),
              dayofweek INT NOT NULL CHECK (dayofweek BETWEEN 0 AND 6),
              month INT NOT NULL CHECK (month BETWEEN 1 AND 12),
              predicted_count FLOAT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );"

      - name: Health check
        run: curl -f http://localhost:8000/ || exit 1

      - name: Test prediction endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"season":3,"holiday":0,"workingday":1,"weather":1,"temp":25,"humidity":55,"windspeed":8,"hour":8,"dayofweek":2,"month":7}' \
            || exit 1

      - name: Show API logs (for debugging)
        if: always()
        run: docker logs bike-sharing-container

      - name: Check data was saved to MySQL
        run: |
          COUNT=$(docker exec bike-sharing-db mysql -u root -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" -N -s -e "SELECT COUNT(*) FROM bike_sharing.predictions;")
          echo "Rows in predictions table: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No data found in predictions table"
            exit 1
          fi

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.prod.yml down